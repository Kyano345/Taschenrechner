<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taschenrechnerprojekt</title>
    <link rel="stylesheet" href="Design.css" />
  </head>

  <body>
    <h1>Der supercoole Taschenrechner von Kyano</h1>

    <div class="box">
      <div class="display" id="display">0</div>

      <div class="rechner-oben">
        <div class="löschknopf">&lt;=</div>
        <div class="wurzelknopf">√x</div>
        <div class="resetknopf">RA</div>
        <div class="quadratknopf">x^2</div>
        <div class="potenzknopf">x^y</div>
      </div>
      <div>
        hallo
      </div>

      <div class="rechner-unten">
        <div class="zahlenbox">
          <div class="zahlenknöpfe eins">1</div>
          <div class="zahlenknöpfe zwei">2</div>
          <div class="zahlenknöpfe drü">3</div>
          <div class="zahlenknöpfe vier">4</div>
          <div class="zahlenknöpfe füf">5</div>
          <div class="zahlenknöpfe sechs">6</div>
          <div class="zahlenknöpfe sieben">7</div>
          <div class="zahlenknöpfe acht">8</div>
          <div class="zahlenknöpfe nün">9</div>
          <div class="zahlenknöpfe null">0</div>
        </div>

        <div class="rechenoperator">
          <div class="rechenoperatorenknöpfe plus">+</div>
          <div class="rechenoperatorenknöpfe minus">-</div>
          <div class="rechenoperatorenknöpfe mal">x</div>
          <div class="rechenoperatorenknöpfe durch">÷</div>
          <div class="resultatknopf">=</div>
        </div>
      </div>
    </div>

    <script src="Funktionen.js"></script>
  </body>
</html>
