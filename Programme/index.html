<!doctype html>
<!-- Dokumenttyp als HTML5 deklarieren -->
<html lang="de">
  <!--Sprache auf Deutsch setzen-->
  <head>
    <meta charset="UTF-8" />
    <!--Sonderzeichen korrekt darstellen-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Responsives Design ermöglichen für Geräte -->
    <title>Taschenrechnerprojekt</title>
    <!-- Titel der Webseite -->
    <link rel="stylesheet" href="style.css" />
    <!-- Verknüpfung mit der CSS-Datei für das Design -->
  </head>

  <body>
    <!-- Hauptinhalt der Webseite -->
    <h1>Der supercoole Taschenrechner von Kyano</h1>

    <div class="Box">
      <div class="Display" id="Display">0</div>

      <div class="Rechner-Zentrum">
        <div class="Zusatzknöpfe">
          <div class="Löschknopf">&lt;=</div>
          <!--&lt weil < wird für tags benutzt-->

          <div class="Wurzelknopf">√x</div>
          <div class="Resetknopf">RA</div>
          <div class="Quadratknopf">x^2</div>
          <div class="Potenzknopf">x^y</div>
        </div>

        <div class="Zahlen-und-Operatoren">
          <div class="Zahlenbox">
            <div class="Zahlenknöpfe">1</div>
            <div class="Zahlenknöpfe">2</div>
            <div class="Zahlenknöpfe">3</div>
            <div class="Zahlenknöpfe">4</div>
            <div class="Zahlenknöpfe">5</div>
            <div class="Zahlenknöpfe">6</div>
            <div class="Zahlenknöpfe">7</div>
            <div class="Zahlenknöpfe">8</div>
            <div class="Zahlenknöpfe">9</div>
            <div class="Zahlenknöpfe null">0</div>
          </div>

          <div class="Rechenoperator">
            <div class="Rechenoperatorenknöpfe plus">+</div>
            <div class="Rechenoperatorenknöpfe minus">-</div>
            <div class="Rechenoperatorenknöpfe mal">x</div>
            <div class="Rechenoperatorenknöpfe durch">÷</div>
          </div>
        </div>
     </div>

        
          <div class="Rechner-unten">
          <div class="Kommaknopf">.</div>
          <div class="Resultatknopf">=</div>
      </div>
    </div>

    <script src="Funktionen.js"></script>
  </body>
</html>
